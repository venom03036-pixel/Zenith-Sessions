name: All Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Release builds, six suites, Luau and packaged checks
        shell: pwsh
        run: ./scripts/Run-AllChecks.ps1 -AllowRestoreDownloads -AcquireLuau
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-check-evidence
          path: artifacts/all-checks/**
          if-no-files-found: error
          retention-days: 14
