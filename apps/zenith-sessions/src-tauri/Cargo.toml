[package]
name = "zenith-sessions-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
base64 = "0.23"
getrandom = "0.4"
hmac = "0.12"
tauri = { version = "2.12", features = [] }
tokio = { version = "1", features = ["io-util", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v4"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
zeroize = "1"
zenith-session-launch = { path = "../launch-core" }

[dev-dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
